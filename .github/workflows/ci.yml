name: CI — verify and publish image
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r app/requirements.txt -r requirements-dev.txt
      - name: Pylint
        run: python -m pylint app --score=no
  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r app/requirements.txt -r requirements-dev.txt
      - name: Unit tests
        run: python -m pytest -q
  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Normalize image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"
      - name: Build image
        run: docker build --tag "devops-ci-app:${GITHUB_SHA}" .
      - name: Smoke-test container
        run: |
          set -euo pipefail
          cleanup() { docker logs smoke || true; docker rm -f smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name smoke -p 127.0.0.1:5000:5000 "devops-ci-app:${GITHUB_SHA}"
          ready=0
          for attempt in {1..15}; do
            if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:5000/health --output health.json; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then echo "::error::/health did not respond after 15 attempts"; exit 1; fi
          python3 -c 'import json; assert json.load(open("health.json")) == {"status": "ok"}'
          cat health.json
          docker exec smoke id
      - name: Tag registry image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag "devops-ci-app:${GITHUB_SHA}" "${IMAGE_NAME}:${GITHUB_SHA}"
          docker tag "devops-ci-app:${GITHUB_SHA}" "${IMAGE_NAME}:latest"
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s\n' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Set up QEMU
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3
      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 --tag "${IMAGE_NAME}:${GITHUB_SHA}" --tag "${IMAGE_NAME}:latest" --push .
  deploy:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, devops-vm]
    permissions:
      contents: read
    concurrency:
      group: deploy-devops-vm
      cancel-in-progress: false
    env:
      VM_HOST: 10.37.129.3
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check VM clock before TLS operations
        run: |
          set -euo pipefail
          now=$(date +%s)
          remote=$(ssh -o BatchMode=yes -i ~/.ssh/devops_vm "devops@$VM_HOST" date +%s)
          if (( remote > now + 300 || remote < now - 300 )); then
            if ! ssh -o BatchMode=yes -i ~/.ssh/devops_vm "devops@$VM_HOST" sudo date -u -s "@$now"; then
              # A cloned VM can have monotonic uptime ahead of the host epoch.
              # Reboot resets that clock and reads the correct virtual RTC.
              ssh -o BatchMode=yes -i ~/.ssh/devops_vm "devops@$VM_HOST" sudo reboot || true
              sleep 3
              ready=0
              for attempt in {1..30}; do
                if remote=$(ssh -o BatchMode=yes -o ConnectTimeout=2 -i ~/.ssh/devops_vm "devops@$VM_HOST" date +%s); then
                  now=$(date +%s)
                  if (( remote < now + 300 && remote > now - 300 )); then ready=1; break; fi
                fi
                sleep 2
              done
              test "$ready" -eq 1
            fi
          fi
          ssh -o BatchMode=yes -i ~/.ssh/devops_vm "devops@$VM_HOST" date -u
      - name: Deploy with Ansible
        working-directory: ansible
        run: ansible-playbook site.yml -e "app_tag=$GITHUB_SHA"
      - name: Check through Nginx
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 10 "http://$VM_HOST/health" | python3 -c 'import sys,json; p=json.load(sys.stdin); print(p); assert p == {"status":"ok"}'
